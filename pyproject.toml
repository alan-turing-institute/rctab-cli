[project]
authors = []
description = "The Command Line Interface for RCTab."
dynamic = [ "dependencies" ]
name = "rctab_cli"
requires-python = ">=3.11"
version = "1.2.0"

[tool.poetry.dependencies]
msal = "^1.31.0"
typer = ">=0.16.0,<1.0.0"
aiohttp = "^3.7.4"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
tabulate = "^0.10.0"
python-dateutil = "^4.0.0"
click = ">=8.1.0,<9.0.0"
importlib = "^1.0.4"
sphinx = {version = "^9.0.4", optional = true}
sphinx-rtd-theme = {version = "^3.1.0", optional = true}
myst-parser = {version = "^5.2.0", optional = true}

[tool.poetry.group.dev.dependencies]
black = "^26.0.0"
isort = "^9.0.0"
mypy = "^2.0.0"
pre-commit = "^4.0.0"
pydocstyle = "^6.3.0"
pylint = "^4.0.0"
pytest = "^9.0.0"

[project.optional-dependencies]
docs = ["sphinx", "sphinx-rtd-theme", "myst-parser"]

[tool.isort]
profile = "black"

[project.scripts]
rctab =  "rctab_cli:app"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
